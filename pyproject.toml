[project]
name = "autonomous-agent-challenge"
version = "0.1.0"
description = "An autonomous agent that generates Word documents from natural-language requests."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
