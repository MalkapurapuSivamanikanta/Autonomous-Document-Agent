# Usage:  cp .env.example .env   (add your OPENAI_API_KEY)   then   docker compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  outputs:
